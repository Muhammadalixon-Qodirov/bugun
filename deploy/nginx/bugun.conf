# /etc/nginx/sites-available/bugun — only this server_name, other sites untouched.
# The API is also reachable under /api/ so the website can proxy the same paths.
#
# Install (placeholders: __SERVER_NAME__ = the API domain, e.g. api.example.uz):
#   sudo cp deploy/nginx/bugun-proxy.inc deploy/nginx/bugun-security.inc /etc/nginx/
#   sudo sed 's/__SERVER_NAME__/api.example.uz/g' deploy/nginx/bugun.conf \
#     > /etc/nginx/sites-available/bugun
#   sudo ln -sf /etc/nginx/sites-available/bugun /etc/nginx/sites-enabled/bugun
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
# The certificate must exist before this file loads; see the TLS notes below.
#
# This file is included in the http {} context (sites-enabled), so the zones,
# maps and upstream below are global: every name is prefixed with "bugun_".

# The only place the API port appears; keep it equal to API_PORT in the
# server's .env (docker-compose publishes the API on 127.0.0.1:API_PORT).
upstream bugun_api {
    server 127.0.0.1:8090;
    keepalive 16;
}

# --- Rate limiting: a coarse first layer in front of the API's own limiter ---
# The website's server (Vercel) calls the API from a few shared IPs and sends
# X-Internal-Secret. Those requests get a separate, much larger per-IP budget;
# the API still verifies the secret and applies its per-visitor limit, so a
# client that fakes the header only reaches the bigger nginx budget.
map $http_x_internal_secret $bugun_direct_key {
    ""      $binary_remote_addr;
    default "";
}
map $http_x_internal_secret $bugun_site_key {
    ""      "";
    default $binary_remote_addr;
}
limit_req_zone  $bugun_direct_key   zone=bugun_api:10m   rate=10r/s;
limit_req_zone  $bugun_site_key     zone=bugun_site:10m  rate=100r/s;
# Listing photos: a catalog page loads dozens at once.
limit_req_zone  $binary_remote_addr zone=bugun_media:10m rate=50r/s;
limit_conn_zone $bugun_direct_key   zone=bugun_conn:10m;

# Strict policy unless the API sent its own (the /docs page does).
map $upstream_http_content_security_policy $bugun_csp {
    ""      "default-src 'none'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    default "";
}

# --- HTTP: only ACME challenges, everything else goes to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;
    server_tokens off;

    # certbot certonly --webroot -w /var/www/certbot -d __SERVER_NAME__
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    # "listen ... http2" works on nginx 1.18-1.24 (Ubuntu LTS) and newer;
    # nginx >= 1.25.1 only warns and prefers a separate "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAME__;
    server_tokens off;

    # Let's Encrypt paths. Obtain once, before enabling this file:
    #   sudo certbot certonly --nginx -d __SERVER_NAME__      (or --webroot, see above)
    # Renewal runs from certbot's own timer; reload nginx after it:
    #   --deploy-hook "systemctl reload nginx"
    ssl_certificate         /etc/letsencrypt/live/__SERVER_NAME__/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/__SERVER_NAME__/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/__SERVER_NAME__/chain.pem;

    # Mozilla "intermediate" profile without DHE (no dhparam file needed).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:bugun_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling. Let's Encrypt stopped running OCSP responders in 2025, so
    # with its certificates nginx logs "no OCSP responder URL" and skips it;
    # it takes effect with any CA that still publishes OCSP.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    include /etc/nginx/bugun-security.inc;

    # Largest request is one photo upload: MEDIA_MAX_UPLOAD_BYTES (default
    # 10 MiB) plus 64 KiB of multipart overhead (internal/httpapi/listings.go).
    # Raise this together with MEDIA_MAX_UPLOAD_BYTES.
    client_max_body_size 11m;

    # JSON is most of the traffic (catalog ~28 KB) and shrinks ~8x.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json text/plain text/css
               text/javascript application/javascript image/svg+xml application/xml;

    limit_req_status 429;
    limit_conn_status 429;

    location ~ ^/(api/)?media/ {
        limit_req zone=bugun_media burst=200 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://bugun_api;
        include /etc/nginx/bugun-proxy.inc;
    }
    location /api/ {
        limit_req zone=bugun_api burst=40 nodelay;
        limit_req zone=bugun_site burst=300 nodelay;
        limit_conn bugun_conn 50;
        proxy_pass http://bugun_api/;
        include /etc/nginx/bugun-proxy.inc;
    }
    location / {
        limit_req zone=bugun_api burst=40 nodelay;
        limit_req zone=bugun_site burst=300 nodelay;
        limit_conn bugun_conn 50;
        proxy_pass http://bugun_api;
        include /etc/nginx/bugun-proxy.inc;
    }
}
